server:
  port: 9092
  shutdown: graceful
  tomcat:
    connection-timeout: 2s
    keep-alive-timeout: 20s

spring:
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  application:
    name: orders-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    username: user
    password: password
    url: jdbc:postgresql://localhost:15432/orders_service_db
    hikari:
      connection-timeout: 2000
      maximum-pool-size: 12
      minimum-idle: 6
  kafka:
    bootstrap-servers: localhost:9097
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: true
        schema.registry.url: http://localhost:8081
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

eureka:
  client:
    service-url:
      defaultZone: ${external.discovery-service-url}
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 5
    prefer-ip-address: true

kafkaprops:
  order-dispatch-topic: v1.orders_dispatch
  nack-sleep-duration: 100ms

external:
  discovery-service-url: http://localhost:8761/eureka/
  # время ожидания перед тем, как совершить повторную попытку получить данные из Menu Service
  retry-backoff: 100ms
  # количество повторных попыток связи с Menu Service
  retry-count: 5
  # фактор неопределенности для того, чтобы минимизировать возможность сценария,
  # при котором несколько инстансов Orders Service будут одновременно посылать ретраи в Menu Service.
  retry-jitter: 0.75
  zipkin-endpoint: http://localhost:9411/api/v2/spans
  loki-url: http://localhost:3100/loki/api/v1/push
  menu:
    rest-client:
      base-url: "http://menu-service"
      read-timeout: 2s
      connection-request-timeout: 5s
      max-connections-per-route: 200
      max-connections-total: 200
      inactivity-validation-period: 2s
    menu-info-path: "/v1/menu-items/menu-info"

resilience4j:
  retry:
    configs:
      default:
        max-attempts: ${external.retry-count} # Максимальное количество попыток выполнения операции
        wait-duration: ${external.retry-backoff} # Продолжительность ожидания между попытками.
        enable-exponential-backoff: true # Включаем экспоненциальное увеличения времени ожидания между попытками.
        exponential-backoff-multiplier: 2 # Множитель экспоненциального увеличения времени ожидания.
        enable-randomized-wait: true #  Включаем случайную задержку между попытками.
        randomized-wait-factor: ${external.retry-jitter} # Это означает, что фактическое время ожидания будет варьироваться на retry-jitter% от исходного значения.
        retry-exceptions: # Список исключений, при возникновении которых будут выполнены повторные попытки.
          - ru.javaops.cloudjava.ordersservice.exception.OrderServiceException
    instances:
      menuBackend:
        base-config: default

management:
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include: "*"
  tracing:
    export:
      enabled: true
      zipkin:
        endpoint: ${external.zipkin-endpoint}
    sampling:
      probability: 1.0
    propagation:
      type: b3
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        all: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

api:
  submit-order:
    summary: Создание заказа пользователем.
    description: |
      Создает новый заказ на имя пользователя. 
      Названия блюд передаются в теле запроса. 
      В случае отсутствия какого-либо блюда в Menu Service, возвращается 500-ая ошибка.
  get-orders:
    summary: Получение списка заказов пользователя.
    description: Возвращает список заказов пользователя, отсортированный по дате создания заказа.
  response:
    submitOk: Заказ успешно сформирован.
    submitBadRequest: Заказ не был сформирован из-за ошибки в запросе. Подробнее в сообщении об ошибке.
    submitNotFound: Заказ не был сформирован, так как часть блюд отсутствует в ресторане.
    submitInternalError: Заказ не был сформирован из-за ошибки на сервере. Подробнее в сообщении об ошибке.
    getOk: Список заказов пользователя сформирован.
    getBadRequest: Не удалось сформировать список заказов пользователя из-за ошибки в параметрах запроса.